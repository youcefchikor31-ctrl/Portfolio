        :root { 
            --neon-blue: #00f3ff; 
            --neon-purple: #9d4edd; 
            --neon-red: #ff2a5f; 
            --dark-bg: #050508;
            --glass-bg: rgba(15, 15, 25, 0.45);
            --glass-border: rgba(0, 243, 255, 0.15);
        }
        
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Rajdhani', sans-serif; }
        
        /* شريط التمرير المخصص */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        body { 
            background: var(--dark-bg); color: #fff; 
            overflow-x: hidden; scroll-behavior: smooth;
        }

        /* خلفية الكانفاس التفاعلية */
        #cyber-canvas { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 0; pointer-events: none; 
        }

        /* تنسيق الأقسام */
        .section { 
            min-height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; position: relative; 
            padding: 80px 20px; z-index: 1; 
        }
        
        /* تدرج لوني خلف الأقسام لزيادة العمق */
        .section::before { 
            content:''; position:absolute; inset:0; 
            background: radial-gradient(circle at center, transparent 0%, #050508 100%); 
            z-index:-1; opacity: 0.9; 
        }

        /* تأثيرات الظهور عند التمرير */
        .hidden-element { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .show-element { opacity: 1; transform: translateY(0); }

        /* الأزرار الاحترافية */
        .btn { 
            width: 100%; max-width: 300px; padding: 16px; margin: 10px; 
            border-radius: 12px; border: 1px solid var(--glass-border); 
            background: var(--glass-bg); cursor: pointer; color: white; 
            font-weight: 700; font-size: 1.1rem; letter-spacing: 1.5px; 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease; position: relative; overflow: hidden;
            text-transform: uppercase;
        }
        .btn::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .btn:hover::after { opacity: 1; }
        .btn:hover { 
            background: rgba(0, 243, 255, 0.1); transform: translateY(-3px); 
            border-color: var(--neon-blue); box-shadow: 0 10px 25px rgba(0,243,255,0.25); 
        }
        .btn-download:hover { border-color: var(--neon-red); box-shadow: 0 10px 25px rgba(255,42,95,0.25); background: rgba(255, 42, 95, 0.1); }
        .btn-web:hover { border-color: var(--neon-purple); box-shadow: 0 10px 25px rgba(157,78,221,0.25); background: rgba(157, 78, 221, 0.1); }

        /* أيقونات السوشيال */
        .btn-social { display: flex; align-items: center; gap: 15px; padding-left: 20px; text-transform: none; }
        .btn-social .s-icon { width: 30px; height: 30px; flex-shrink: 0; transition: 0.4s; }
        .btn-social:hover .s-icon { transform: rotate(10deg) scale(1.2); }
        .btn-social svg { width: 100%; height: 100%; }
        
        /* الصورة الشخصية */
        .profile-wrapper { position: relative; margin-bottom: 25px; }
        .profile-img { 
            width: 170px; height: 170px; border-radius: 50%; 
            border: 3px solid transparent; 
            background: linear-gradient(var(--dark-bg), var(--dark-bg)) padding-box, 
                        linear-gradient(45deg, var(--neon-blue), var(--neon-purple)) border-box;
            box-shadow: 0 0 35px rgba(0,243,255,0.3); 
            object-fit: cover; z-index: 2; position: relative;
            transition: transform 0.5s ease;
        }
        .profile-wrapper:hover .profile-img { transform: scale(1.05); }

        #home h1 { text-shadow: 0 0 25px var(--neon-blue); margin-bottom: 10px; font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: 3px; font-weight: 900; }
        #home .tagline { color: var(--neon-red); font-weight: 700; letter-spacing: 4px; text-transform: uppercase; font-size: clamp(0.9rem, 2vw, 1.1rem); margin-bottom: 40px; text-shadow: 0 0 15px rgba(255,42,95,0.5); }

        /* مبدل اللغات */
        .lang-box { position: fixed; top: 25px; left: 25px; z-index: 1000; display: flex; flex-direction: column; gap: 5px; }
        .arrow { cursor: pointer; background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 8px 15px; border-radius: 8px; backdrop-filter: blur(10px); transition: 0.3s; font-size: 0.8rem; text-align: center; font-family: 'Orbitron', sans-serif;}
        .arrow:hover { border-color: var(--neon-blue); background: rgba(0,243,255,0.15); box-shadow: 0 0 15px rgba(0,243,255,0.3); }

        h2 { margin-bottom: 40px; font-size: clamp(1.8rem, 4vw, 2.5rem); font-family: 'Orbitron', sans-serif; text-shadow: 0 0 20px var(--neon-blue); letter-spacing: 2px; text-transform: uppercase; }
        h2::after { content: ''; display: block; width: 80px; height: 4px; margin: 15px auto 0; background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple)); border-radius: 2px; }

        /* شبكة الأعمال */
        .works-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; width: 100%; max-width: 1000px; }
        .work-category { 
            background: var(--glass-bg); border: 1px solid var(--glass-border); 
            border-radius: 20px; padding: 40px 20px; backdrop-filter: blur(12px); 
            display: flex; flex-direction: column; align-items: center; 
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .work-category:hover { border-color: rgba(255,255,255,0.3); }
        .work-category h3 { margin-bottom: 25px; font-size: 1.5rem; font-family: 'Orbitron', sans-serif; }
        .category-apps h3 { color: var(--neon-red); text-shadow: 0 0 15px rgba(255,42,95,0.4); }
        .category-web h3 { color: var(--neon-purple); text-shadow: 0 0 15px rgba(157,78,221,0.4); }

        /* صندوق البايو */
        .bio-box {
            background: var(--glass-bg); border: 1px solid var(--glass-border); 
            padding: 40px; border-radius: 20px; backdrop-filter: blur(10px); 
            max-width: 700px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        #bio-text { line-height: 1.9; font-size: 1.2rem; letter-spacing: 0.5px; color: #e0e0e0; }

        /* النافذة المنبثقة (Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 2000; display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.4s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: #0a0a10; border: 1px solid var(--neon-blue);
            box-shadow: 0 0 40px rgba(0,243,255,0.2), inset 0 0 20px rgba(0,243,255,0.05); 
            border-radius: 20px; padding: 50px 30px; width: 90%; max-width: 500px; 
            text-align: center; position: relative; transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-title { font-family: 'Orbitron', sans-serif; color: var(--neon-blue); font-size: 2rem; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0,243,255,0.5);}
        .modal-desc { font-size: 1.15rem; line-height: 1.7; color: #ccc; margin-bottom: 35px; }
        .modal-close {

        .modal-close:hover { opacity: 1; color: var(--neon-red); transform: rotate(90deg); }
        .modal-action-btn { background: var(--neon-blue); color: #000; border: none; }
        .modal-action-btn:hover { background: #fff; box-shadow: 0 0 20px var(--neon-blue); transform: translateY(-3px); }
    </style>
</head>

// ==================== تأثير الظهور عند التمرير (Scroll Animations) ====================
const observerOptions = { threshold: 0.1, rootMargin: "0px 0px -50px 0px" };
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add('show-element');
            // إيقاف المراقبة بعد الظهور لتقليل استهلاك الموارد
            observer.unobserve(entry.target);
        }
    });
}, observerOptions);

document.querySelectorAll('.hidden-element').forEach(el => observer.observe(el));

// ==================== تأثير الميلان ثلاثي الأبعاد (3D Tilt Effect) للكمبيوتر ====================
document.querySelectorAll('.tilt-effect').forEach(el => {
    el.addEventListener('mousemove', e => {
        if(window.innerWidth < 768) return; // تعطيل في الهواتف
        const rect = el.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -10; // درجة الميلان
        const rotateY = ((x - centerX) / centerX) * 10;
        el.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
    });
    el.addEventListener('mouseleave', () => {
        el.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
    });
});

// ==================== خلفية الجزيئات السيبرانية (Canvas Particle Network) ====================
const canvas = document.getElementById('cyber-canvas');
const ctx = canvas.getContext('2d');
let width, height, particles = [];
let mouse = { x: null, y: null, radius: 150 };

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });

class Particle {
    constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 1;
        this.baseX = this.x; this.baseY = this.y;
        this.density = (Math.random() * 30) + 1;
        this.vx = (Math.random() - 0.5) * 1;
        this.vy = (Math.random() - 0.5) * 1;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if(this.x > width || this.x < 0) this.vx = -this.vx;
        if(this.y > height || this.y < 0) this.vy = -this.vy;

        // التفاعل مع الماوس
        if(mouse.x != null) {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx*dx + dy*dy);
            if(distance < mouse.radius) {
                const force = (mouse.radius - distance) / mouse.radius;
                this.x -= dx * force * 0.05;
                this.y -= dy * force * 0.05;
            }
        }
    }
    draw() {
        ctx.fillStyle = '#00f3ff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
    }
}

function initParticles() {
    particles = [];
    let numParticles = (width * height) / 9000; // تقليل العدد لزيادة الأداء
    for(let i = 0; i < numParticles; i++) particles.push(new Particle());
}
initParticles();

function animateParticles() {
    ctx.clearRect(0, 0, width, height);
    for(let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        // رسم الخطوط المترابطة (الشبكة العصبية)
        for(let j = i; j < particles.length; j++) {
            let dx = particles[i].x - particles[j].x;
            let dy = particles[i].y - particles[j].y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 120) {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(0, 243, 255, ${1 - dist/120})`;
                ctx.lineWidth = 1;
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(animateParticles);
}
animateParticles();
</script>
