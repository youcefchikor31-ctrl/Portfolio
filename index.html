<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youcef Mekki - Cyber Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --neon-blue: #00f3ff; 
            --neon-purple: #9d4edd; 
            --neon-red: #ff2a5f; 
            --dark-bg: #050508;
            --glass-bg: rgba(15, 15, 25, 0.45);
            --glass-border: rgba(0, 243, 255, 0.15);
        }
        
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Rajdhani', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        body { background: var(--dark-bg); color: #fff; overflow-x: hidden; scroll-behavior: smooth; }

        #cyber-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 80px 20px; z-index: 1; }
        .section::before { content:''; position:absolute; inset:0; background: radial-gradient(circle at center, transparent 0%, #050508 100%); z-index:-1; opacity: 0.9; }

        .hidden-element { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .show-element { opacity: 1; transform: translateY(0); }

        .btn { 
            width: 100%; max-width: 300px; padding: 16px; margin: 10px; 
            border-radius: 12px; border: 1px solid var(--glass-border); 
            background: var(--glass-bg); cursor: pointer; color: white; 
            font-weight: 700; font-size: 1.1rem; letter-spacing: 1px; 
            backdrop-filter: blur(12px); transition: all 0.3s ease; position: relative; overflow: hidden;
            text-transform: uppercase;
        }
        .btn:hover { background: rgba(0, 243, 255, 0.1); transform: translateY(-3px); border-color: var(--neon-blue); box-shadow: 0 10px 25px rgba(0,243,255,0.25); }
        .btn-web:hover { border-color: var(--neon-purple); box-shadow: 0 10px 25px rgba(157,78,221,0.25); background: rgba(157, 78, 221, 0.1); }

        .btn-social { display: flex; align-items: center; gap: 15px; padding-left: 20px; text-transform: none; }
        .btn-social .s-icon { width: 30px; height: 30px; flex-shrink: 0; transition: 0.4s; }
        .btn-social:hover .s-icon { transform: rotate(10deg) scale(1.2); }
        .btn-social svg { width: 100%; height: 100%; }
        
        .profile-wrapper { position: relative; margin-bottom: 25px; }
        .profile-img { 
            width: 170px; height: 170px; border-radius: 50%; border: 3px solid transparent; 
            background: linear-gradient(var(--dark-bg), var(--dark-bg)) padding-box, linear-gradient(45deg, var(--neon-blue), var(--neon-purple)) border-box;
            box-shadow: 0 0 35px rgba(0,243,255,0.3); object-fit: cover; z-index: 2; position: relative; transition: transform 0.5s ease;
        }
        .profile-wrapper:hover .profile-img { transform: scale(1.05); }

        h1 { text-shadow: 0 0 25px var(--neon-blue); margin-bottom: 10px; font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: 3px; font-weight: 900; }
        .tagline { color: var(--neon-red); font-weight: 700; letter-spacing: 4px; text-transform: uppercase; font-size: clamp(0.9rem, 2vw, 1.1rem); margin-bottom: 40px; text-shadow: 0 0 15px rgba(255,42,95,0.5); }

        .lang-box { position: fixed; top: 25px; left: 25px; z-index: 1000; display: flex; flex-direction: column; gap: 5px; }
        .arrow { cursor: pointer; background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 8px 15px; border-radius: 8px; backdrop-filter: blur(10px); transition: 0.3s; font-size: 0.8rem; text-align: center; font-family: 'Orbitron', sans-serif;}
        .arrow:hover { border-color: var(--neon-blue); background: rgba(0,243,255,0.15); }

        h2 { margin-bottom: 40px; font-size: clamp(1.8rem, 4vw, 2.5rem); font-family: 'Orbitron', sans-serif; text-shadow: 0 0 20px var(--neon-blue); letter-spacing: 2px; text-transform: uppercase; }
        h2::after { content: ''; display: block; width: 80px; height: 4px; margin: 15px auto 0; background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple)); border-radius: 2px; }

        .bio-box { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 40px; border-radius: 20px; backdrop-filter: blur(10px); max-width: 700px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        #bio-text { line-height: 1.9; font-size: 1.2rem; letter-spacing: 0.5px; color: #e0e0e0; }

        /* ================= الهاتف الافتراضي (Interactive Phone Mockup) ================= */
        .app-showcase-container { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; align-items: center; max-width: 1000px; width: 100%; margin-bottom: 40px; }
        
        .app-selector { display: flex; flex-direction: column; gap: 15px; flex: 1; min-width: 280px; }
        .app-btn { 
            background: var(--glass-bg); border: 1px solid var(--glass-border); color: #fff; 
            padding: 15px 20px; border-radius: 12px; font-family: 'Orbitron', sans-serif; font-size: 1.1rem;
            cursor: pointer; transition: 0.3s; text-align: left; position: relative; overflow: hidden;
        }
        .app-btn:hover, .app-btn.active { background: rgba(255,42,95,0.15); border-color: var(--neon-red); box-shadow: 0 0 20px rgba(255,42,95,0.3); padding-left: 30px; }
        .app-btn.active::before { content:'▶'; position: absolute; left: 10px; color: var(--neon-red); }

        .phone-mockup-wrapper { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .phone-frame {
            width: 280px; height: 580px; background: #000; border: 14px solid #1a1a24; 
            border-radius: 40px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(0,243,255,0.2);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .phone-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 130px; height: 25px; background: #1a1a24; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 10; }
        
        .phone-screen { flex: 1; position: relative; background: #111; display: flex; justify-content: center; align-items: center; }
        .phone-screen img { width: 100%; height: 100%; object-fit: contain; position: absolute; opacity: 0; transition: opacity 0.5s ease-in-out; }
        .phone-screen img.active { opacity: 1; }
        
        .download-app-btn { background: var(--neon-blue); color: #000; font-weight: 900; box-shadow: 0 0 15px rgba(0,243,255,0.5); width: 280px; }
        .download-app-btn:hover { background: #fff; transform: scale(1.05); }

        .works-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; }
        .work-category { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .work-category h3 { margin-bottom: 25px; font-size: 1.5rem; font-family: 'Orbitron', sans-serif; color: var(--neon-purple); text-shadow: 0 0 15px rgba(157,78,221,0.4); }

        @media (max-width:768px) { .app-showcase-container { flex-direction: column; } .app-selector { width: 100%; } .app-btn { text-align: center; } .app-btn:hover, .app-btn.active { padding-left: 20px; } .app-btn.active::before { display: none; } }
    </style>
</head>

<script>
const uiData = {
    en: { name:"Youcef Mekki", tagline:"Cybersecurity & Full-Stack Eng", bioTitle:"About Me", bioText:"I am Youcef Mekki, a Full-Stack Developer and Cybersecurity enthusiast. Born 31/08/2008. I specialize in building highly secure, scalable web applications and engineering innovative AI-driven experiences.", socialTitle:"Digital Presence", appsTitle: "📱 Mobile Apps Showcase", webTitle: "🌐 Web & AI Core", btnBio:"About Me", btnApps:"My Apps", btnWorks:"Web & AI" },
    ar: { name:"يوسف مكي", tagline:"مطور شامل وخبير أمن سيبراني", bioTitle:"الملف الشخصي", bioText:"أنا يوسف مكي، مطور تطبيقات ومواقع شغوف بالأمن السيبراني. (مواليد 31/08/2008). أتخصص في بناء أنظمة وتطبيقات ويب عالية الأمان وتطوير تجارب برمجية مبتكرة تعتمد على الذكاء الاصطناعي.", socialTitle:"التواجد الرقمي", appsTitle: "📱 استعراض تطبيقاتي", webTitle: "🌐 مشاريع الويب والذكاء الاصطناعي", btnBio:"من أنا", btnApps:"تطبيقاتي", btnWorks:"مشاريع الويب" },
    fr: { name:"Youcef Mekki", tagline:"Ingénieur Full-Stack & Cyber", bioTitle:"À Propos", bioText:"Je suis Youcef Mekki, développeur Full-Stack et passionné de cybersécurité. Né le 31/08/2008. Je conçois des applications web ultra-sécurisées et des expériences innovantes basées sur l'IA.", socialTitle:"Présence Numérique", appsTitle: "📱 Applications Mobile", webTitle: "🌐 Projets Web & IA", btnBio:"À Propos", btnApps:"Applications", btnWorks:"Projets Web" }
};

let langs=['en','ar','fr'], langIdx=0;
function updateUI(){
    const l=langs[langIdx];
    document.getElementById('lang-display').innerText=l.toUpperCase();
    document.getElementById('name').innerText=uiData[l].name;
    document.getElementById('tagline').innerText=uiData[l].tagline;
    document.getElementById('bio-title').innerText=uiData[l].bioTitle;
    document.getElementById('bio-text').innerText=uiData[l].bioText;
    document.getElementById('social-title').innerText=uiData[l].socialTitle;
    document.getElementById('apps-title').innerText=uiData[l].appsTitle;
    document.getElementById('web-title').innerText=uiData[l].webTitle;
    document.getElementById('btn-bio').innerText=uiData[l].btnBio;
    document.getElementById('btn-apps').innerText=uiData[l].btnApps;
    document.getElementById('btn-works').innerText=uiData[l].btnWorks;
    document.documentElement.dir = l==='ar' ? 'rtl' : 'ltr';
}
function nextLang(){ langIdx=(langIdx+1)%langs.length; updateUI(); }
function prevLang(){ langIdx=(langIdx-1+langs.length)%langs.length; updateUI(); }
updateUI();

// ==================== تحديث أسماء الصور ====================
// الكود الآن يطلب الأسماء البسيطة التي قمت بتغييرها في هاتفك
const mobileApps = {
    capCut: {
        name: "CapCut Pro",
        images: ["capcut1.jpg", "capcut2.jpg", "capcut3.jpg"],
        url: "https://www.mediafire.com/file/oa95vgyft6s5i0u/CapCut_15.5.0.apk.bak/file"
    },
    wifiFixer: {
        name: "WiFi Fixer Pro",
        images: ["wifi1.jpg", "wifi2.jpg", "wifi3.jpg", "wifi4.jpg"],
        url: "https://www.mediafire.com/file/kyixbx3xaazl4h4/WiFi_Fixer_Pro_1.0.apk/file"
    },
    yuchVault: {
        name: "Yuch Vault",
        images: ["vault1.jpg", "vault2.jpg", "vault3.jpg"],
        url: "https://www.mediafire.com/file/edn5t2jxe3h2l4w/Yuch_Vault_1.0.apk/file"
    },
    hiTv: {
        name: "HiTV",
        images: ["hitv1.jpg", "hitv2.jpg"],
        url: "https://www.mediafire.com/file/ktarrep9980x8of/HiTV_3.13.2.apk/file"
    },
    movie: {
        name: "Movie V3.0.2",
        images: ["movie1.jpg", "movie2.jpg"],
        url: "https://www.mediafire.com/file/l5m4o2d8e70ytqr/Movie_V3.0.2.apk/file"
    }
};

let currentAppKey = "wifiFixer";
let currentImageIndex = 0;
let sliderInterval;

function initPhoneMockup() {
    const btnContainer = document.getElementById('app-buttons-container');
    btnContainer.innerHTML = '';
    Object.keys(mobileApps).forEach(key => {
        const btn = document.createElement('button');
        btn.className = `app-btn ${key === currentAppKey ? 'active' : ''}`;
        btn.innerText = mobileApps[key].name;
        btn.onclick = () => selectApp(key);
        btnContainer.appendChild(btn);
    });
    renderPhoneScreen();
}

function selectApp(key) {
    currentAppKey = key;
    currentImageIndex = 0;
    document.querySelectorAll('.app-btn').forEach(btn => {
        btn.classList.remove('active');
        if(btn.innerText === mobileApps[key].name) btn.classList.add('active');
    });
    renderPhoneScreen();
}

function renderPhoneScreen() {
    const screen = document.getElementById('phone-screen-slider');
    screen.innerHTML = '';
    clearInterval(sliderInterval);

    const images = mobileApps[currentAppKey].images;
    images.forEach((imgSrc, index) => {
        const img = document.createElement('img');
        img.src = imgSrc;
        if(index === 0) img.classList.add('active');
        img.id = `phone-img-${index}`;
        screen.appendChild(img);
    });

    if(images.length > 1) {
        sliderInterval = setInterval(() => {
            document.getElementById(`phone-img-${currentImageIndex}`).classList.remove('active');
            currentImageIndex = (currentImageIndex + 1) % images.length;
            document.getElementById(`phone-img-${currentImageIndex}`).classList.add('active');
        }, 2500);
    }
}

function downloadActiveApp() {
    window.open(mobileApps[currentAppKey].url, '_blank');
}

initPhoneMockup();

const observerOptions = { threshold: 0.1, rootMargin: "0px 0px -50px 0px" };
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add('show-element');
            observer.unobserve(entry.target);
        }
    });
}, observerOptions);
document.querySelectorAll('.hidden-element').forEach(el => observer.observe(el));

const canvas = document.getElementById('cyber-canvas');
const ctx = canvas.getContext('2d');
let width, height, particles = [];
let mouse = { x: null, y: null, radius: 150 };

function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

class Particle {
    constructor() {
        this.x = Math.random() * width; this.y = Math.random() * height;
        this.size = Math.random() * 2 + 1;
        this.vx = (Math.random() - 0.5) * 1; this.vy = (Math.random() - 0.5) * 1;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if(this.x > width || this.x < 0) this.vx = -this.vx;
        if(this.y > height || this.y < 0) this.vy = -this.vy;
        if(mouse.x != null) {
            let dx = mouse.x - this.x, dy = mouse.y - this.y;
            let distance = Math.sqrt(dx*dx + dy*dy);
            if(distance < mouse.radius) {
                const force = (mouse.radius - distance) / mouse.radius;
                this.x -= dx * force * 0.05; this.y -= dy * force * 0.05;
            }
        }
    }
    draw() { ctx.fillStyle = '#00f3ff'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
}

function initParticles() {
    particles = [];
    let numParticles = (width * height) / 9000;
    for(let i = 0; i < numParticles; i++) particles.push(new Particle());
}
initParticles();

function animateParticles() {
    ctx.clearRect(0, 0, width, height);
    for(let i = 0; i < particles.length; i++) {
        particles[i].update(); particles[i].draw();
        for(let j = i; j < particles.length; j++) {
            let dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 120) {
                ctx.beginPath(); ctx.strokeStyle = `rgba(0, 243, 255, ${1 - dist/120})`;
                ctx.lineWidth = 1; ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
            }
        }
    }
    requestAnimationFrame(animateParticles);
}
animateParticles();
</script>
</body>
